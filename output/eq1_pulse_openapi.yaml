              - $ref: '#/components/schemas/PulseRef'
              title: Pulse
            scale_amp:
              anyOf:
              - type: number
              - type: string
              - $ref: '#/components/schemas/ValueRef'
              - type: 'null'
              default:
              title: Scale Amp
            cond:
              anyOf:
              - $ref: '#/components/schemas/ValueRef'
              - type: 'null'
              default:
          required:
          - channel
          - pulse
          type: object
      required:
      - play
      title: Play
      type: object
    PulseDecl:
      additionalProperties: false
      description: "Pulse declaration operation.\n\nPulses must be declared before they can be referred to.\nPulse declarations are scoped to the surrounding context and its children."
      properties:
        pulse_decl:
          additionalProperties: false
          properties:
            name:
              title: Name
              type: string
            pulse:
              $ref: '#/components/schemas/PulseType'
          required:
          - name
          - pulse
          type: object
      required:
      - pulse_decl
      title: PulseDecl
      type: object
    PulseRef:
      additionalProperties: false
      description: "Reference to a pulse, spelled ``{\"pulse_name\": \"pi_pulse\"}``.\n\nPulses must be declared in the surrounding context or one of its parents."
