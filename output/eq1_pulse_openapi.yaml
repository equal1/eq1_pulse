openapi: 3.1.0
info:
  title: Equal1 Pulse Models API
  version: 0.8.1.post12+git.fc357ef9.dirty
  description: OpenAPI schema for Equal1 Pulse library models. This schema defines all the Pydantic models used for pulse sequencing, channel operations, control flow, and data operations.
components:
  schemas:
    Amplitude:
      description: Model to represent the (complex) amplitude of a voltage signal.
      oneOf:
      - $ref: '#/components/schemas/ComplexVolts'
      - $ref: '#/components/schemas/ComplexMillivolts'
      title: Amplitude
    Angle:
      description: "A model representing an angle in either degrees, radians, turns or half-turns.\n\nTurns are also known as revolutions or cycles, also :math:`\\tau=2\\pi` radians or 360°.\nHalf-turns are also known as half-cycles, also :math:`\\pi` radians or 180°."
      oneOf:
      - $ref: '#/components/schemas/Degrees'
      - $ref: '#/components/schemas/Radians'
      - $ref: '#/components/schemas/Turns'
      - $ref: '#/components/schemas/HalfTurns'
      title: Angle
    ArbitrarySampledPulse:
      additionalProperties: false
      description: "Pulse type that uses arbitrary sampled waveform data.\n\nThe amplitude refers to the reference amplitude of the pulse, which is usually the peak amplitude.\nThe duration refers to the total duration of the pulse.\nThe samples (complex or real) are expected to be normalized between -1 and 1, and will be scaled by the amplitude.\nThe samples are distributed over the duration of the pulse (uniformly or according to custom `time_points`),\nwith interpolation applied as needed."
      properties:
        pulse_type:
          const: arbitrary
          default: arbitrary
          title: Pulse Type
          type: string
        duration:
          anyOf:
          - $ref: '#/components/schemas/Duration'
          - $ref: '#/components/schemas/ValueRef'
          title: Duration
        amplitude:
          anyOf:
          - $ref: '#/components/schemas/Amplitude'
          - $ref: '#/components/schemas/ValueRef'
          title: Amplitude
        samples:
          anyOf:
          - $ref: '#/components/schemas/NumpyFloatArray1D'
          - $ref: '#/components/schemas/NumpyComplexArray1D'
          title: Samples
        interpolation:
          anyOf:
          - type: string
          - type: 'null'
          default:
          title: Interpolation
        time_points:
          anyOf:
          - $ref: '#/components/schemas/NumpyFloatArray1D'
          - type: 'null'
          default:
      required:
      - duration
      - amplitude
      - samples
      title: ArbitrarySampledPulse
      type: object
    Barrier:
      additionalProperties: false
      description: "Synchronize channels.\n\nThe barrier operation causes channels to wait until all channels have reached the barrier."
      properties:
        barrier:
          additionalProperties: false
          properties:
            channels:
              items:
                $ref: '#/components/schemas/ChannelTarget'
              title: Channels
              type: array
          required:
          - channels
          type: object
      required:
      - barrier
      title: Barrier
      type: object
    BaseUnit:
      additionalProperties: false
      description: "Base class for units: a frozen model whose single field is named for the unit itself.\n\n``extra=\"forbid\"``, inherited from :class:`~.base_models.FrozenModel`, is what makes that one\nkey exclusive, and so what lets :class:`UnitDiscriminator` select a unit by it.\n\nThe unit-suffixed string (``\"10us\"``) used to be accepted here, by a before-validator paired\nwith a schema hook that advertised a form nothing ever produced. It is now read only where it\nis authored, by :meth:`~.base_models.WrappedValueModel.parse` and the quantity constructors,\nover :func:`~.arithmetic.parse_unit_suffixed_value`."
      properties: {}
      title: BaseUnit
      type: object
    BinaryExpr:
      additionalProperties: false
      description: An arithmetic operation on two operands.
      properties:
        binary_op:
          additionalProperties: false
          properties:
            op:
              enum:
              - +
              - '-'
              - '*'
              - /
              - '%'
              title: Op
              type: string
            lhs:
              $ref: '#/components/schemas/Expression'
            rhs:
              $ref: '#/components/schemas/Expression'
          required:
          - op
          - lhs
          - rhs
          type: object
      required:
      - binary_op
      title: BinaryExpr
      type: object
    CallExpr:
      additionalProperties: false
      description: A call to one of the named functions in :data:`ExpressionFunction`.
      properties:
        function:
          additionalProperties: false
          properties:
            name:
              $ref: '#/components/schemas/ExpressionFunction'
            args:
              items:
                $ref: '#/components/schemas/Expression'
              title: Args
              type: array
          required:
          - name
          - args
          type: object
      required:
      - function
      title: CallExpr
      type: object
    ChannelOp:
      oneOf:
      - $ref: '#/components/schemas/Play'
      - $ref: '#/components/schemas/Wait'
      - $ref: '#/components/schemas/Barrier'
      - $ref: '#/components/schemas/SetFrequency'
      - $ref: '#/components/schemas/ShiftFrequency'
      - $ref: '#/components/schemas/SetPhase'
      - $ref: '#/components/schemas/ShiftPhase'
      - $ref: '#/components/schemas/Record'
      - $ref: '#/components/schemas/Trace'
      - $ref: '#/components/schemas/CompensateDC'
    ChannelOpBase:
      additionalProperties: false
      description: Base class for operations involving a single channel.
      properties:
        op_type:
          title: Op Type
        channel:
          $ref: '#/components/schemas/ChannelTarget'
      required:
      - op_type
      - channel
      title: ChannelOpBase
      type: object
    ChannelRef:
      $ref: '#/components/schemas/IdentifierStr'
      description: "Reference to a channel, whose wire form is the bare channel name ``\"q0_drive\"``.\n\nChannels are defined in the target's hardware configuration.\n\nUnlike the :class:`Reference` subclasses this is a :class:`~pydantic.RootModel`, so the name\n*is* the model and there is no field name to spell twice. It validates and serializes the bare\nstring in both schema modes with no override of any kind; :meth:`__eq__` below is the only\nmember it carries."
      title: ChannelRef
    ChannelTarget:
      oneOf:
      - $ref: '#/components/schemas/ChannelRef'
      - $ref: '#/components/schemas/ExternalRef'
    ChannelsOpBase:
      additionalProperties: false
      description: Base class for operations involving multiple channels.
      properties:
        op_type:
          title: Op Type
        channels:
          items:
            $ref: '#/components/schemas/ChannelTarget'
          title: Channels
          type: array
      required:
      - op_type
      - channels
      title: ChannelsOpBase
      type: object
    CompareExpr:
      additionalProperties: false
      description: "A comparison of two operands, yielding a boolean.\n\nSeparate from :class:`BinaryExpr` because its result kind is categorically different: a\ncomparison is a valid :attr:`~.control_flow.ConditionalBase.var` where an arithmetic node is not."
      properties:
        compare_op:
          additionalProperties: false
          properties:
            op:
              enum:
              - <
              - <=
              - '>'
              - '>='
              - ==
              - '!='
              title: Op
              type: string
            lhs:
              $ref: '#/components/schemas/Expression'
            rhs:
              $ref: '#/components/schemas/Expression'
          required:
          - op
          - lhs
          - rhs
          type: object
      required:
      - compare_op
      title: CompareExpr
      type: object
    ComparisonMode:
      description: Comparison modes for discrimination operations.
      enum:
      - '>='
      - '>'
      - <=
      - <
      title: ComparisonMode
      type: string
    CompensateDC:
      additionalProperties: false
      description: "Apply DC offset compensation to the channel.\n\nA square wave of specified duration is played on the channel. The amplitude of the wave is calculated to\nresult in a zero average value when integrated over the duration since the laste reset.\n\nIf ``null``/:obj:`None` duration is specified, the accumulated value is reset to zero, without\nplaying a compensation pulse.\n\nIf ``max_amp`` is specified, the amplitude of the compensation pulse is limited to that value.\nIf the amplitude is calculated to be higher, the pulse area is subtracted from the accumulated value,\nleaving the possibility to compensate the rest in the following operations.\n\nIf ``rise_time`` and ``fall_time`` are specified, they define the duration of linear ramps\nat the beginning and end of the compensation pulse. The ramps are included in the area calculation.\nThe rise and fall times are also included in the total duration of the compensation pulse."
      properties:
        dc_comp:
          additionalProperties: false
          properties:
            channel:
              $ref: '#/components/schemas/ChannelTarget'
            duration:
              anyOf:
              - $ref: '#/components/schemas/Duration'
              - $ref: '#/components/schemas/ValueRef'
              - type: 'null'
              title: Duration
            max_amp:
              anyOf:
              - $ref: '#/components/schemas/Magnitude'
              - $ref: '#/components/schemas/ValueRef'
              - type: 'null'
              default:
              title: Max Amp
            rise_time:
              anyOf:
              - $ref: '#/components/schemas/Duration'
              - $ref: '#/components/schemas/ValueRef'
              - type: 'null'
              default:
              title: Rise Time
            fall_time:
              anyOf:
              - $ref: '#/components/schemas/Duration'
              - $ref: '#/components/schemas/ValueRef'
              - type: 'null'
              default:
              title: Fall Time
          required:
          - channel
          - duration
          type: object
      required:
      - dc_comp
      title: CompensateDC
      type: object
    ComplexMillivolts:
      additionalProperties: false
      description: Millivolts as a unit of voltage (real + imaginary).
      properties:
        mV:
          anyOf:
          - type: integer
          - type: number
          - $ref: '#/components/schemas/complex_from_tuple'
          title: Mv
      required:
      - mV
      title: ComplexMillivolts
      type: object
    ComplexToRealProjectionMode:
      description: Projection modes for converting complex values to real values.
      enum:
      - real
      - imag
      - abs
      - phase
      title: ComplexToRealProjectionMode
      type: string
    ComplexVoltage:
      description: "A model representing a complex voltage in volts or millivolts.\n\nComplex voltages are used to represent both amplitude and phase information,\nand are used with with mixing or demodulation operations."
      oneOf:
      - $ref: '#/components/schemas/ComplexVolts'
      - $ref: '#/components/schemas/ComplexMillivolts'
      title: ComplexVoltage
    ComplexVolts:
      additionalProperties: false
      description: Volts as a unit of voltage (real + imaginary).
      properties:
        V:
          anyOf:
          - type: integer
          - type: number
          - $ref: '#/components/schemas/complex_from_tuple'
          title: V
      required:
      - V
      title: ComplexVolts
      type: object
    Conditional:
      additionalProperties: false
      description: "Represents a conditional sequence of operations.\n\n:ivar op_type: Operation type, always \"if\" -- the sole key of its wire object\n:ivar var: The predicate for the condition.\n:ivar body: The sequence of operations to execute if the condition is met"
      properties:
        if:
          additionalProperties: false
          properties:
            var:
              $ref: '#/components/schemas/ValueRef'
            body:
              $ref: '#/components/schemas/OpSequence'
          required:
          - var
          - body
          type: object
      required:
      - if
      title: Conditional
      type: object
    DataOpBase:
      additionalProperties: false
      description: Base class for all data operations.
      properties:
        op_type:
          title: Op Type
      required:
      - op_type
      title: DataOpBase
      type: object
    Degrees:
      additionalProperties: false
      description: Degrees as a unit of angle.
      properties:
        deg:
          anyOf:
          - type: integer
          - type: number
          title: Deg
      required:
      - deg
      title: Degrees
      type: object
    DemodIntegration:
      additionalProperties: false
      description: "Demodulation integration of measured values.\n\nThe demodulation operation will multiply the measured signal with\nthe channels' output signal before integration.\nIf scale_cos/scale_sin are specified they can be used to scale and \"flip\" the real/imaginary parts of the result.\n\nAn optional phase may be applied to rotate the result."
      properties:
        integration_type:
          const: demod
          default: demod
          title: Integration Type
          type: string
        phase:
          anyOf:
          - $ref: '#/components/schemas/Phase'
          - $ref: '#/components/schemas/ValueRef'
          - type: 'null'
          default:
          title: Phase
        scale_cos:
          anyOf:
          - type: number
          - $ref: '#/components/schemas/ValueRef'
          default: 1
          title: Scale Cos
        scale_sin:
          anyOf:
          - type: number
          - $ref: '#/components/schemas/ValueRef'
          default: 1
          title: Scale Sin
      title: DemodIntegration
      type: object
    DiscriminableOp:
      oneOf:
      - $ref: '#/components/schemas/ChannelOp'
      - oneOf:
        - $ref: '#/components/schemas/VariableDecl'
        - $ref: '#/components/schemas/ParameterDecl'
        - $ref: '#/components/schemas/ExternalDecl'
        - $ref: '#/components/schemas/PulseDecl'
        - $ref: '#/components/schemas/Discriminate'
        - $ref: '#/components/schemas/Store'
      - $ref: '#/components/schemas/ExternalBlock'
      - $ref: '#/components/schemas/Repetition'
      - $ref: '#/components/schemas/Iteration'
      - $ref: '#/components/schemas/Conditional'
    DiscriminableSchedulableOp:
      oneOf:
      - $ref: '#/components/schemas/ChannelOp'
      - oneOf:
        - $ref: '#/components/schemas/VariableDecl'
        - $ref: '#/components/schemas/ParameterDecl'
        - $ref: '#/components/schemas/ExternalDecl'
        - $ref: '#/components/schemas/PulseDecl'
        - $ref: '#/components/schemas/Discriminate'
        - $ref: '#/components/schemas/Store'
      - $ref: '#/components/schemas/SchedRepetition'
      - $ref: '#/components/schemas/SchedIteration'
      - $ref: '#/components/schemas/SchedConditional'
    Discriminate:
      additionalProperties: false
      description: Discriminate operation to convert complex data to boolean based on threshold comparison.
      properties:
        discriminate:
          additionalProperties: false
          properties:
            target:
              $ref: '#/components/schemas/VarName'
            source:
              $ref: '#/components/schemas/VarName'
            threshold:
              anyOf:
              - $ref: '#/components/schemas/Threshold'
              - $ref: '#/components/schemas/ValueRef'
              title: Threshold
            rotation:
              anyOf:
              - $ref: '#/components/schemas/Phase'
              - $ref: '#/components/schemas/ValueRef'
              default:
                deg: 0
              title: Rotation
            compare:
              $ref: '#/components/schemas/ComparisonMode'
              default: '>='
            project:
              $ref: '#/components/schemas/ComplexToRealProjectionMode'
              default: real
          required:
          - target
          - source
          - threshold
          type: object
      required:
      - discriminate
      title: Discriminate
      type: object
    Duration:
      description: Special case of non-negative Time representing a duration.
      oneOf:
      - $ref: '#/components/schemas/Seconds'
      - $ref: '#/components/schemas/Milliseconds'
      - $ref: '#/components/schemas/Microseconds'
      - $ref: '#/components/schemas/Nanoseconds'
      title: Duration
    Expression:
      oneOf:
      - $ref: '#/components/schemas/LiteralExpr'
      - $ref: '#/components/schemas/SymbolExpr'
      - $ref: '#/components/schemas/UnaryExpr'
      - $ref: '#/components/schemas/BinaryExpr'
      - $ref: '#/components/schemas/CompareExpr'
      - $ref: '#/components/schemas/NotExpr'
      - $ref: '#/components/schemas/LogicalExpr'
      - $ref: '#/components/schemas/CallExpr'
    ExpressionFunction:
      enum:
      - min
      - max
      - abs
      - sqrt
      - sin
      - cos
      - tan
      - exp
      - log
      type: string
    ExternalBlock:
      additionalProperties: false
      description: "An opaque, channel-reserving block of externally defined contents.\n\nIt is simultaneously: the way to reference an externally defined program (a calibrated gate, a\nvendor routine, a hand-written OpenPulse ``defcal``); the scoping construct needed to *consume*\nOpenQASM ``box``; and the mechanism that makes a multi-channel operation atomic against the\nsurrounding scheduler.\n\nSemantics:\n\n1. **Reservation.** The block occupies every channel in :attr:`channels` for its whole extent.\n   No operation elsewhere in the program may be scheduled on any of those channels within that\n   extent.\n2. **Synchronisation.** Entry and exit are synchronisation points across :attr:`channels`: the\n   block starts at the latest availability of all of them and all of them become free\n   simultaneously at its end. (Same rule as OpenQASM ``box`` resource participation and\n   ``defcal`` entry alignment.)\n3. **Non-interference.** Channels *not* listed are unaffected and may be driven concurrently.\n4. **Opacity / optimisation barrier.** Contents are not described by this IR. Operations may\n   not be moved into or out of the block. Nothing may be assumed about what happens on the\n   reserved channels inside it.\n5. **Timed vs flex.**\n\n   - ``duration=D`` -- hard total-duration constraint. It is an error if the referenced\n     program's natural duration exceeds ``D``. Slack placement inside the block is the\n     program's business.\n   - ``duration=None`` -- flex. Duration is the referenced program's natural duration,\n     resolved by whatever holds the program definitions. Directly analogous to OpenQASM's\n     untimed ``box`` and to ``durationof``.\n6. **Empty** :attr:`program`. ``program=None`` with a :attr:`duration` is a pure reservation --\n   \"these channels are busy for this long, do not touch them.\" Useful for modelling externally\n   driven intervals.\n\nRegarding :attr:`params`:\n\n4. If ``duration=None`` (flex) **and** any :attr:`params` value is a :class:`~.reference_types.VariableRef`\n   whose value is only known at run time, the block's duration is not resolvable at compile\n   time. OpenQASM has the same rule for ``defcal``: the body must have a definite duration\n   regardless of its parameters. Either the external program guarantees a parameter-independent\n   duration, or the block must carry an explicit :attr:`duration`. This is enforced as a\n   validation rule with a clear error, not a runtime surprise.\n5. The IR does not know the referenced program's signature -- opacity is the point. Arity and\n   type checking of :attr:`params`/:attr:`results`/:attr:`channels` belongs to whatever resolves\n   :attr:`program`. The IR validates only what it can see: that :attr:`results` variables are\n   declared, that :attr:`channels` values are valid channel targets -- a channel name, or an\n   :class:`~.reference_types.ExternalRef` when the calibration store owns the name -- and\n   rule 4 above."
      properties:
        external_block:
          additionalProperties: false
          properties:
            program:
              anyOf:
              - $ref: '#/components/schemas/FullyQualifiedIdentifier'
              - type: 'null'
              default:
            channels:
              additionalProperties:
                $ref: '#/components/schemas/ChannelTarget'
              title: Channels
              type: object
            params:
              anyOf:
              - additionalProperties:
                  $ref: '#/components/schemas/ExternalParamValue'
                type: object
              - type: 'null'
              default:
              title: Params
            results:
              anyOf:
              - additionalProperties:
                  $ref: '#/components/schemas/VarName'
                type: object
              - type: 'null'
              default:
              title: Results
            duration:
              anyOf:
              - $ref: '#/components/schemas/Duration'
              - $ref: '#/components/schemas/ValueRef'
              - type: 'null'
              default:
              title: Duration
          required:
          - channels
          type: object
      required:
      - external_block
      title: ExternalBlock
      type: object
    ExternalDecl:
      additionalProperties: false
      description: "External constant declaration operation.\n\nAn external constant is a symbol resolved outside the program: its value is looked up per\nsubmission in a calibration store by name, rather than supplied directly by the caller. It is\nreferenced with ``ext()``.\n\nExternal declarations are scoped to the surrounding context and its children."
      properties:
        extern_decl:
          additionalProperties: false
          properties:
            dtype:
              $ref: '#/components/schemas/VariableDTypeType'
            shape:
              anyOf:
              - items:
                  type: integer
                type: array
              - type: 'null'
              default:
              title: Shape
            unit:
              anyOf:
              - type: string
              - type: 'null'
              default:
              title: Unit
            name:
              $ref: '#/components/schemas/ExternalSymbolStr'
            default:
              anyOf:
              - $ref: '#/components/schemas/SymbolValue'
              - type: 'null'
              default:
            limits:
              anyOf:
              - $ref: '#/components/schemas/ValueLimits'
              - type: 'null'
              default:
          required:
          - dtype
          - name
          type: object
      required:
      - extern_decl
      title: ExternalDecl
      type: object
    ExternalParamValue:
      oneOf:
      - $ref: '#/components/schemas/Time'
      - $ref: '#/components/schemas/Voltage'
      - $ref: '#/components/schemas/ComplexVoltage'
      - $ref: '#/components/schemas/Frequency'
      - $ref: '#/components/schemas/Angle'
      - $ref: '#/components/schemas/VariableRef'
      - $ref: '#/components/schemas/PulseRef'
      - $ref: '#/components/schemas/ExternalRef'
      - $ref: '#/components/schemas/PulseType'
      - $ref: '#/components/schemas/Expression'
      - type: boolean
      - type: integer
      - type: number
      - $ref: '#/components/schemas/complex_from_tuple'
      - type: string
    ExternalPulse:
      additionalProperties: false
      description: "Pulse type that references an externally defined pulse function.\n\nThe amplitude refers to the reference amplitude of the pulse, which is usually the peak amplitude.\nThe duration refers to the total duration of the pulse.\n\nThe pulse function is expected to be defined elsewhere, such as in a pulse library or a hardware definition."
      properties:
        pulse_type:
          const: external
          default: external
          title: Pulse Type
          type: string
        duration:
          anyOf:
          - $ref: '#/components/schemas/Duration'
          - $ref: '#/components/schemas/ValueRef'
          title: Duration
        amplitude:
          anyOf:
          - $ref: '#/components/schemas/Amplitude'
          - $ref: '#/components/schemas/ValueRef'
          title: Amplitude
        function:
          $ref: '#/components/schemas/FullyQualifiedIdentifier'
        params:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ExternalParamValue'
            type: object
          - type: 'null'
          default:
          title: Params
      required:
      - duration
      - amplitude
      - function
      title: ExternalPulse
      type: object
    ExternalRef:
      additionalProperties: false
      description: "Reference to a constant that is resolved outside the program, spelled ``{\"ext\": \"q0.f01\"}``.\n\nExternal symbols must be declared in the surrounding context or one of its parents. Their value\nis supplied per submission by the framework running the program, so a serialized program can be\nre-submitted against fresh values without being rebuilt."
      properties:
        ext:
          $ref: '#/components/schemas/ExternalSymbolStr'
      required:
      - ext
      title: ExternalRef
      type: object
    ExternalSymbolStr:
      type: string
    Frequency:
      description: A model representing a frequency in Hertz, Kilohertz, Megahertz, or Gigahertz.
      oneOf:
      - $ref: '#/components/schemas/Hertz'
      - $ref: '#/components/schemas/Kilohertz'
      - $ref: '#/components/schemas/Megahertz'
      - $ref: '#/components/schemas/Gigahertz'
      title: Frequency
    FullIntegration:
      additionalProperties: false
      description: Full summation of measured values.
      properties:
        integration_type:
          const: full
          default: full
          title: Integration Type
          type: string
      title: FullIntegration
      type: object
    FullyQualifiedIdentifier:
      type: string
    Gigahertz:
      additionalProperties: false
      description: Gigahertz as a unit of frequency.
      properties:
        GHz:
          anyOf:
          - type: integer
          - type: number
          title: Ghz
      required:
      - GHz
      title: Gigahertz
      type: object
    HalfTurns:
      additionalProperties: false
      description: "Half turns as a unit of angle.\n\nA half turn is half a full rotation, i.e. 180 degrees or π radians."
      properties:
        half_turns:
          anyOf:
          - type: integer
          - type: number
          title: Half Turns
      required:
      - half_turns
      title: HalfTurns
      type: object
    Hertz:
      additionalProperties: false
      description: Hertz as a unit of frequency.
      properties:
        Hz:
          anyOf:
          - type: integer
          - type: number
          title: Hz
      required:
      - Hz
      title: Hertz
      type: object
    IdentifierStr:
      type: string
    IntegrationType:
      additionalProperties: false
      description: Base class for different types of integration operations.
      properties:
        integration_type:
          title: Integration Type
      required:
      - integration_type
      title: IntegrationType
      type: object
    IterableSequence:
      anyOf:
      - $ref: '#/components/schemas/LinSpace'
      - $ref: '#/components/schemas/Range'
      - items:
          type: string
        type: array
      - $ref: '#/components/schemas/NumpyIterableArray'
    Iteration:
      additionalProperties: false
      description: "Represents an iteration over a sequence of operations.\n\n:ivar op_type: Operation type, always \"for\" -- the sole key of its wire object\n:ivar var: The variable reference for the iterated value.\n:ivar items: The range or array over which to iterate.\n:ivar body: The sequence of operations to execute in each iteration"
      properties:
        for:
          additionalProperties: false
          properties:
            var:
              anyOf:
              - items:
                  $ref: '#/components/schemas/VarName'
                type: array
              - $ref: '#/components/schemas/VarName'
              title: Var
            items:
              anyOf:
              - items:
                  $ref: '#/components/schemas/IterableSequence'
                type: array
              - $ref: '#/components/schemas/IterableSequence'
              title: Items
            body:
              $ref: '#/components/schemas/OpSequence'
          required:
          - var
          - items
          - body
          type: object
      required:
      - for
      title: Iteration
      type: object
    Kilohertz:
