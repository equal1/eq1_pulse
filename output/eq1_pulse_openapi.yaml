      type: object
    UnaryExpr:
      additionalProperties: false
      description: "Negation of a single operand.\n\nNegation is the only unary operator: ``abs`` is :class:`CallExpr` with ``function=\"abs\"``, where\nevery other named mathematical operation lives."
