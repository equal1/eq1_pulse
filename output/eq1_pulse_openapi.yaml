          anyOf:
          - type: integer
          - type: number
          title: Ms
      required:
      - ms
      title: Milliseconds
      type: object
    Millivolts:
      additionalProperties: false
      description: Millivolts as a unit of voltage (real).
      properties:
        mV:
          anyOf:
          - type: integer
          - type: number
          title: Mv
