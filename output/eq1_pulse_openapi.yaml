              $ref: '#/components/schemas/Expression'
          required:
          - op
          - rhs
          type: object
      required:
      - unary_op
      title: UnaryExpr
      type: object
    ValueLimits:
      additionalProperties: false
      description: "Declared bounds on a symbol's value.\n\nThese bounds are carried on the declaration and never enforced by eq1_pulse itself: eq1_pulse\ndoes not perform unit conversion, so checking a bound would require the outside framework's\ncooperation anyway. This model exists so a bound can be expressed and travel with the program."
      properties:
        minimum:
          anyOf:
          - $ref: '#/components/schemas/SymbolValue'
          - type: 'null'
          default:
        maximum:
          anyOf:
          - $ref: '#/components/schemas/SymbolValue'
          - type: 'null'
          default:
        allowed:
          anyOf:
          - items:
              $ref: '#/components/schemas/SymbolValue'
            type: array
          - type: 'null'
          default:
          title: Allowed
      title: ValueLimits
      type: object
    ValueRef:
      anyOf:
      - $ref: '#/components/schemas/SymbolRef'
      - $ref: '#/components/schemas/Expression'
    VarName:
      $ref: '#/components/schemas/IdentifierStr'
    VariableDTypeType:
      enum:
      - bool
      - int
      - float
      - complex
      type: string
    VariableDecl:
      additionalProperties: false
      description: "Variable declaration operation.\n\nVariables must be declared before they can be referred to.\n\nVariable declarations are scoped to the surrounding context and its children."
      properties:
        var_decl:
          additionalProperties: false
          properties:
            dtype:
              $ref: '#/components/schemas/VariableDTypeType'
            shape:
              anyOf:
              - items:
                  type: integer
                type: array
              - type: 'null'
              default:
              title: Shape
            unit:
              anyOf:
              - type: string
              - type: 'null'
              default:
              title: Unit
            name:
              $ref: '#/components/schemas/IdentifierStr'
          required:
          - dtype
          - name
          type: object
      required:
      - var_decl
      title: VariableDecl
      type: object
    VariableRef:
      additionalProperties: false
      description: "Reference to a variable, spelled ``{\"var\": \"amp\"}``.\n\nVariables must be declared in the surrounding context or one of its parents."
      properties:
        var:
          $ref: '#/components/schemas/IdentifierStr'
      required:
      - var
      title: VariableRef
      type: object
    Voltage:
      description: A model representing a real voltage in volts or millivolts.
      oneOf:
      - $ref: '#/components/schemas/Volts'
      - $ref: '#/components/schemas/Millivolts'
      title: Voltage
    Volts:
      additionalProperties: false
      description: Volts as a unit of voltage (real).
      properties:
        V:
          anyOf:
          - type: integer
          - type: number
          title: V
      required:
      - V
      title: Volts
      type: object
    Wait:
      additionalProperties: false
      description: "Add wait of duration on channel(s).\n\nThe wait operations are scheduled to start as soon as possible on each channel.\n\nThe relative timing between channels is not guaranteed.\n\n``Wait`` is the more primitive counterpart of OpenQASM's multi-resource ``delay``, which\nconflates a barrier with a delay. The composite decomposes exactly:\n\n.. code-block:: text\n\n    import:   delay[d] a, b;   ->   barrier(a, b) ; wait(a, b, d)\n    export:   wait(a, b, d)    ->   delay[d] a;  delay[d] b;\n\nThe import identity holds because after ``barrier(a, b)`` both channels' cursors are equal, so\nan independent per-channel wait lands both ends at ``max(...) + d`` -- precisely the OpenQASM\nsemantics. The export identity holds because a single-resource ``delay`` advances only its own\ncursor."
      properties:
        wait:
          additionalProperties: false
          properties:
            channels:
              items:
                $ref: '#/components/schemas/ChannelTarget'
              title: Channels
              type: array
            duration:
              anyOf:
              - $ref: '#/components/schemas/Duration'
              - $ref: '#/components/schemas/ValueRef'
              title: Duration
          required:
          - channels
          - duration
          type: object
      required:
      - wait
      title: Wait
      type: object
    complex_from_tuple:
      items:
        type: number
      maxItems: 2
      minItems: 2
      type: array
