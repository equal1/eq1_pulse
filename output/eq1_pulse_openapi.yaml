    LiteralExpr:
      additionalProperties: false
      description: "A concrete value appearing in an expression.\n\n``value`` is :data:`~.data_ops.SymbolValue` -- the same union that types a declaration's\n``default``, so there is one notion of \"a concrete value\" across the IR."
      properties:
