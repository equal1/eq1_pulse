    NotExpr:
      additionalProperties: false
      description: "Boolean negation of a single operand.\n\nSplit out from :class:`LogicalExpr` by arity, the same way :class:`UnaryExpr` is split from\n:class:`BinaryExpr`: ``not`` is the only unary boolean connective, so it gets its own node\ninstead of an optional ``lhs`` on a node shared with the binary ones."
      properties:
