    LogicalExpr:
      additionalProperties: false
      description: "A boolean connective over two operands.\n\n``and``/``or`` only -- ``not`` is :class:`NotExpr`. For n-ary ``and``/``or``, nest the\nexpressions (e.g., ``and(and(a, b), c)``)."
      properties:
