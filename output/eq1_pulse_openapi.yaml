      title: NotExpr
      type: object
    NumpyComplexArray1D:
      items:
        items:
          type: number
        maxItems: 2
        minItems: 2
        type: array
      type: array
    NumpyFloatArray1D:
      items:
        type: number
      type: array
    NumpyIntArray1D:
      items:
        type: integer
      type: array
    NumpyIterableArray:
      anyOf:
      - $ref: '#/components/schemas/NumpyIntArray1D'
      - $ref: '#/components/schemas/NumpyFloatArray1D'
      - $ref: '#/components/schemas/NumpyComplexArray1D'
    OpSequence:
      description: "A sequence of operation items that can be serialized as a list.\n\nThis class represents an ordered collection of operation sequence items that\nwill be serialized as a list when converted to JSON or other formats.\n\n:ivar items: List of operation sequence items"
      items:
        $ref: '#/components/schemas/OpSequenceItem'
      title: OpSequence
      type: array
    OpSequenceItem:
      anyOf:
      - $ref: '#/components/schemas/DiscriminableOp'
      - $ref: '#/components/schemas/OpSequence'
    ParameterDecl:
      additionalProperties: false
      description: "Parameter declaration operation.\n\nA parameter is a symbol whose value is supplied by the caller when the program is submitted,\nrather than computed inside the program. Everything else about it is a variable: it is\nreferenced with ``var()``, it obeys the same lexical scoping, and it may be read anywhere a\nvariable may be read. ``default`` makes it optional at submission time.\n\nParameter declarations are scoped to the surrounding context and its children."
      properties:
        param_decl:
          additionalProperties: false
          properties:
            dtype:
              $ref: '#/components/schemas/VariableDTypeType'
            shape:
              anyOf:
              - items:
                  type: integer
                type: array
              - type: 'null'
              default:
              title: Shape
            unit:
              anyOf:
              - type: string
              - type: 'null'
              default:
              title: Unit
            name:
              $ref: '#/components/schemas/IdentifierStr'
            default:
              anyOf:
              - $ref: '#/components/schemas/SymbolValue'
              - type: 'null'
              default:
            limits:
              anyOf:
              - $ref: '#/components/schemas/ValueLimits'
              - type: 'null'
              default:
          required:
          - dtype
          - name
          type: object
      required:
      - param_decl
      title: ParameterDecl
      type: object
    Phase:
      description: "Special case of Angle where the value represents a phase angle.\n\nMatrix-multiplying \"@\" a :class:`Voltage` or :class:`ComplexVoltage` with a :class:`Phase`\nwill result in a complex rotated :class:`Amplitude`."
      oneOf:
      - $ref: '#/components/schemas/Degrees'
      - $ref: '#/components/schemas/Radians'
      - $ref: '#/components/schemas/Turns'
      - $ref: '#/components/schemas/HalfTurns'
      title: Phase
    Play:
