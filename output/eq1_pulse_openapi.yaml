        pulse_name:
          $ref: '#/components/schemas/IdentifierStr'
      required:
      - pulse_name
      title: PulseRef
      type: object
    PulseType:
      discriminator:
        mapping:
          arbitrary: '#/components/schemas/ArbitrarySampledPulse'
          external: '#/components/schemas/ExternalPulse'
          sine: '#/components/schemas/SinePulse'
          square: '#/components/schemas/SquarePulse'
        propertyName: pulse_type
      oneOf:
      - $ref: '#/components/schemas/SquarePulse'
      - $ref: '#/components/schemas/SinePulse'
      - $ref: '#/components/schemas/ExternalPulse'
      - $ref: '#/components/schemas/ArbitrarySampledPulse'
    Radians:
      additionalProperties: false
      description: Radians as a unit of angle.
      properties:
        rad:
          title: Rad
          type: number
      required:
      - rad
      title: Radians
      type: object
    Range:
      additionalProperties: false
      description: "Represents a range of values with a start, stop, and step.\n\nThe step can only be zero if the start and stop values are equal. Otherwise,\nthe step must evenly divide the difference between the start and stop values.\n\nIn case of complex numbers, the the difference must be an integral multiple of the step.\nThe sign of the step is adjusted to ensure the stop value is reached.\n\n**The stop point is always included in the range.**\n\n:ivar start: Starting value (can be real or complex)\n:ivar stop: Ending value (can be real or complex) included in the range\n:ivar step: Step size (can be real or complex)\n\n.. note::\n    Units should be specified in the variable declaration, not in the Range itself."
      properties:
        start:
          anyOf:
          - type: integer
          - type: number
          - type: string
          title: Start
        stop:
          anyOf:
          - type: integer
          - type: number
          - type: string
          title: Stop
        step:
          anyOf:
          - type: integer
          - type: number
          - $ref: '#/components/schemas/complex_from_tuple'
          title: Step
      required:
      - start
      - stop
      - step
      title: Range
      type: object
    Record:
      additionalProperties: false
      description: "Acquire scalar data from the channel with integration.\n\nThe integration type can be either \"full\" or \"demod\".\nFull integration is a simple accumulation of the signal.\nDemod integration is a complex multiplication of the signal with the channel's\nfrequency and phase followed by accumulation.\n\nThe result of the integration is saved into a scalar (complex) variable.\n\nFurther processing may be applied to the result, such as projection to real/imaginary parts,\nsee :class:`Discriminate`."
      properties:
        record:
          additionalProperties: false
          properties:
            channel:
              $ref: '#/components/schemas/ChannelTarget'
            var:
              $ref: '#/components/schemas/VarName'
            duration:
              anyOf:
              - $ref: '#/components/schemas/Duration'
              - $ref: '#/components/schemas/ValueRef'
              title: Duration
            integration:
              anyOf:
              - $ref: '#/components/schemas/FullIntegration'
              - $ref: '#/components/schemas/DemodIntegration'
              title: Integration
            time_of_flight:
              anyOf:
              - $ref: '#/components/schemas/Duration'
              - $ref: '#/components/schemas/ValueRef'
              - type: 'null'
              default:
              title: Time Of Flight
          required:
          - channel
          - var
          - duration
          - integration
          type: object
      required:
      - record
      title: Record
      type: object
    RefPt:
      description: "An enumeration of reference points for Schedulables.\n\nThese represent the alignment points of the existing and the newly inserted schedulable."
      enum:
