      - average
      - count
      - trace
      title: StoreMode
      type: string
    SymbolExpr:
      additionalProperties: false
      description: "A reference to a declared symbol appearing in an expression.\n\n``symbol`` is :data:`~.reference_types.SymbolRef`, so a variable, a parameter and an external\nconstant are all spelled the same way here."
      properties:
        symbol:
          $ref: '#/components/schemas/SymbolRef'
      required:
      - symbol
      title: SymbolExpr
      type: object
    SymbolRef:
      oneOf:
      - $ref: '#/components/schemas/VariableRef'
      - $ref: '#/components/schemas/ExternalRef'
    SymbolValue:
      oneOf:
